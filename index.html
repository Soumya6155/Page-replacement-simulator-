<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Replacement Visualizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Page Replacement <span class="highlight">Visualizer</span></h1>
      <p>Watch OS memory allocation happen in real-time.</p>
    </header>

    <div class="card controls">
      <div class="input-group">
        <label for="refString">Reference String (Comma Separated)</label>
        <input type="text" id="refString" value="7, 0, 1, 2, 0, 3, 0, 4, 2, 3, 0, 3">
      </div>
      
      <div class="input-group small-input">
        <label for="frameCount">Frames</label>
        <input type="number" id="frameCount" min="2" max="7" value="3">
      </div>

      <div class="input-group">
        <label>Algorithm</label>
        <div class="toggle-group" id="algToggle">
          <button class="active" data-alg="FIFO">FIFO</button>
          <button data-alg="LRU">LRU</button>
          <button data-alg="Optimal">Optimal</button>
        </div>
      </div>
    </div>

    <div class="dashboard">
      <div class="card kpi">
        <div>
          <p class="kpi-label">Total Faults</p>
          <p class="kpi-value text-red" id="kpi-faults">0</p>
        </div>
        <div class="kpi-icon icon-red">!</div>
      </div>
      <div class="card kpi">
        <div>
          <p class="kpi-label">Total Hits</p>
          <p class="kpi-value text-green" id="kpi-hits">0</p>
        </div>
        <div class="kpi-icon icon-green">✓</div>
      </div>
      <div class="card kpi">
        <div>
          <p class="kpi-label">Hit Rate</p>
          <p class="kpi-value text-blue" id="kpi-rate">0%</p>
        </div>
        <div class="kpi-icon icon-blue">%</div>
      </div>
    </div>

    <div class="card">
      <h2 class="grid-title">Step-by-Step Matrix</h2>
      <div class="visualizer-scroll">
        <div id="grid-container" class="grid-container">
          </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
